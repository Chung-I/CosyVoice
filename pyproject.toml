[project]
name = "cosyvoice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "conformer==0.3.2",
    "deepspeed==0.14.2",
    "diffusers==0.29.0",
    "fastapi",
    "fastapi-cli",
    "gdown==5.1.0",
    "gradio==5.4.0",
    "hydra-core==1.3.2",
    "hyperpyyaml==1.2.2",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "matplotlib==3.7.5",
    "modelscope==1.15.0",
    "networkx==3.1",
    "omegaconf==2.3.0",
    "onnx==1.16.0",
    "onnxruntime-gpu==1.18.0",
    "openai-whisper",
    "protobuf==4.25",
    "pydantic",
    "pyworld==0.3.4",
    "requests>=2.32.3",
    "rich==13.7.1",
    "soundfile==0.12.1",
    "tensorboard==2.14.0",
    "torch",
    "torchaudio",
    "transformers==4.49.0",
    "uvicorn==0.30.0",
    "vllm==0.7.3",
    "wetextprocessing==1.0.4.1",
    "wget==3.2",
]

[tool.setuptools]
packages = ["cosyvoice"]

[build-system]
requires = ["setuptools", "wheel", "pip"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pip>=25.0.1",
]

